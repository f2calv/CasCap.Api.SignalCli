# =============================================================================
# CasCap.Api.SignalCli — Docker Compose
# =============================================================================
#
# ── Local Development (default) ──────────────────────────────────────────────
#   Starts the signal-cli REST API the integration tests and the sample run against.
#
#   docker compose up --detach
#
# Service endpoint:
#   signal-cli REST : http://localhost:8080
# =============================================================================
services:
  signalcli:
    # 0.100 bundles signal-cli 0.14.5, which fixes the sealed-sender receive
    # NullPointerException that broke all inbound reception on 0.14.1-0.14.4.1.
    image: bbernhard/signal-cli-rest-api:0.100
    ports:
      - 8080:8080
    environment:
      MODE: json-rpc
    volumes:
      - signalcli_data:/home/.local/share/signal-cli
    healthcheck:
      test: [ CMD-SHELL, curl -sf http://localhost:8080/v1/health || exit 1 ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  signalcli_data:
