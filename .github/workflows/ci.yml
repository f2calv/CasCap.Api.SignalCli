name: ci

on:
  workflow_dispatch:
    inputs:
      push-preview:
        type: boolean
        description: Push a pre-release NuGet package from a non-default branch?
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

#Deny all by default; each job grants only the scopes it needs.
permissions: {}

jobs:
  lint:
    permissions:
      contents: read #checkout
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1

  versioning:
    permissions:
      contents: read #checkout and release lookup
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      tag-prefix: ''
      tag-and-release: false

  build:
    runs-on: ubuntu-latest
    needs: [versioning]
    #Note: a permissions block is subtractive - every scope not listed resets to none.
    #The composite action cannot request these itself, so they must be declared here.
    permissions:
      id-token: write #OIDC token for NuGet Trusted Publishing
      contents: read #checkout
      packages: write #push to nuget.pkg.github.com
    steps:
      - uses: f2calv/gha-dotnet-nuget@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          #The nuget.org username matches the GitHub owner. If they ever diverge this must
          #become a literal, or the token exchange fails with an opaque 401.
          nuget-user: ${{ github.repository_owner }}
          configuration: Release
          push-preview: ${{ inputs.push-preview }}
          version: ${{ needs.versioning.outputs.version }}
          solution-name: CasCap.Api.SignalCli.Release.slnx
          #Integration tests require a registered Signal account and a running signal-cli REST API.
          dotnet-test-args: --filter-not-trait Category=Integration

  #The GenericHost sample image. It exists to ship ffmpeg alongside the voice speech-to-text
  #harness; the library itself is consumed as a NuGet package.
  containerize:
    uses: f2calv/gha-workflows/.github/workflows/container-image-build.yml@v1
    permissions:
      packages: write #for pushing container image
      contents: read #note: for private repos setting packages to write, will reset all other permissions to none (weird?)
    needs: [versioning]
    if: github.event_name != 'pull_request'
    with:
      registry: ghcr.io/${{ github.repository_owner }}
      tag: ${{ needs.versioning.outputs.version }}
      dockerfile: Dockerfile
      platform: linux/amd64,linux/arm64
      args: --build-arg PROJECT=samples/GenericHost/GenericHost.csproj
      push-image: ${{ github.actor != 'copilot[bot]' }}

  release:
    needs: [lint, versioning, build, containerize]
    if: needs.versioning.outputs.release-exists == 'false'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: write
    with:
      semVer: ${{ needs.versioning.outputs.version }}
      tag-prefix: ''
      move-major-tag: false
