name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

#Deny all by default; each job grants only the scopes it needs.
permissions: {}

jobs:
  lint:
    permissions:
      contents: read #checkout
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1

  versioning:
    permissions:
      contents: read #checkout and release lookup
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    with:
      tag-prefix: ''
      tag-and-release: false

  build:
    needs: [versioning]
    permissions:
      contents: read
    uses: f2calv/gha-workflows/.github/workflows/app-build-dotnet.yml@v1
    with:
      version: ${{ needs.versioning.outputs.version }}
      configuration: Release
      solution-name: CasCap.Api.SignalCli.Release.slnx
      dotnet-test-args: '["--filter-not-trait", "Category=Integration"]'

    ...

